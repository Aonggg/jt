name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  release-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build jt.exe
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' -o jt.exe ./cmd/jt
      - name: Build jt-gui.exe
        shell: pwsh
        # The .NET Framework compiler on the runner; the AnyCPU assembly runs on both architectures.
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu /warnaserror+ /out:jt-gui.exe /win32icon:gui\jt.ico /win32manifest:gui\app.manifest /r:System.Web.Extensions.dll (Get-ChildItem gui\*.cs | ForEach-Object FullName)
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          $asset = "jt-windows-${{ matrix.goarch }}.zip"
          Compress-Archive -Path jt.exe, jt-gui.exe -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jt-windows-${{ matrix.goarch }}.zip
            jt-windows-${{ matrix.goarch }}.zip.sha256
  # The Linux build is for WSL (and plain Linux): same vault, same commands,
  # Windows clipboard through interop.
  release-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags '-s -w' -o jt ./cmd/jt
          asset="jt-linux-${{ matrix.goarch }}.tar.gz"
          tar -czf "$asset" jt
          sha256sum "$asset" > "$asset.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jt-linux-${{ matrix.goarch }}.tar.gz
            jt-linux-${{ matrix.goarch }}.tar.gz.sha256
