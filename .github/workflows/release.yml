name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
  release:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags '-s -w' -o jt.exe ./cmd/jt
      - name: Package
        shell: pwsh
        run: |
          $asset = "jt-windows-${{ matrix.goarch }}.zip"
          Compress-Archive -Path jt.exe -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -NoNewline "$asset.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            jt-windows-${{ matrix.goarch }}.zip
            jt-windows-${{ matrix.goarch }}.zip.sha256
