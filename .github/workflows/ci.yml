name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: pwsh
        run: |
          $unformatted = gofmt -l ./cmd
          if ($unformatted) { Write-Host $unformatted; exit 1 }
      - run: go vet ./...
      - run: go test ./...
      - run: .\build.ps1
        shell: pwsh
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags '-s -w' -o jt ./cmd/jt
