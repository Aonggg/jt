name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l ./cmd && if (gofmt -l ./cmd) { exit 1 }
        shell: pwsh
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags '-s -w' -o jt.exe ./cmd/jt
